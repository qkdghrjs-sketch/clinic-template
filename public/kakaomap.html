  .root_daum_roughmap iframe { width: 100% !important; height: 100% !important; }
  .root_daum_roughmap .wrap_controllers { display: none !important; }
  #daumRoughmapContainer1785101978423 { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="daumRoughmapContainer1785101978423" class="root_daum_roughmap root_daum_roughmap_landing"></div>
<script charset="UTF-8" src="https://ssl.daumcdn.net/dmaps/map_js_init/roughmapLoader.js"></script>
<script charset="UTF-8">
  new daum.roughmap.Lander({
    "timestamp" : "1785101978423",
    "key" : "ruwwsr6o4if",
    "mapWidth" : "640",
    "mapHeight" : "360"

</script>
